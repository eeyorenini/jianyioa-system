<VirtualHost *:80>
    ServerAdmin webmaster@example.com
    ServerAlias erp.fujinwanjia.com
    ErrorLog "D:/BtSoft/wwwlogs/erp.fujinwanjia.com-error.log"
    CustomLog "D:/BtSoft/wwwlogs/erp.fujinwanjia.com-access.log" combined

    # Proxy: API and uploads to Node.js backend
    <IfModule mod_proxy.c>
        ProxyRequests Off
        SSLProxyEngine Off
        <Proxy *>
            Require all granted
        </Proxy>
        ProxyPass /api/ http://127.0.0.1:3001/api/
        ProxyPassReverse /api/ http://127.0.0.1:3001/api/
        ProxyPass /uploads/ http://127.0.0.1:3001/uploads/
        ProxyPassReverse /uploads/ http://127.0.0.1:3001/uploads/
    </IfModule>

    # SPA routing: all non-file/non-dir paths -> index.html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_URI} !^/uploads/
    RewriteCond %{REQUEST_URI} !^/assets/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]

    DocumentRoot "d:/wwwroot/erp.fujinwanjia.com"
    <Directory "d:/wwwroot/erp.fujinwanjia.com">
        Options FollowSymLinks ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex index.html index.htm
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@example.com
    ServerAlias erp.fujinwanjia.com
    ErrorLog "D:/BtSoft/wwwlogs/erp.fujinwanjia.com-error.log"
    CustomLog "D:/BtSoft/wwwlogs/erp.fujinwanjia.com-access.log" combined

    SSLEngine On
    SSLCertificateFile conf/ssl/erp.fujinwanjia.com/fullchain.pem
    SSLCertificateKeyFile conf/ssl/erp.fujinwanjia.com/privkey.pem
    SSLCipherSuite EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH
    SSLProtocol All -SSLv2 -SSLv3
    SSLHonorCipherOrder On

    <IfModule mod_proxy.c>
        ProxyRequests Off
        SSLProxyEngine Off
        <Proxy *>
            Require all granted
        </Proxy>
        ProxyPass /api/ http://127.0.0.1:3001/api/
        ProxyPassReverse /api/ http://127.0.0.1:3001/api/
        ProxyPass /uploads/ http://127.0.0.1:3001/uploads/
        ProxyPassReverse /uploads/ http://127.0.0.1:3001/uploads/
    </IfModule>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_URI} !^/uploads/
    RewriteCond %{REQUEST_URI} !^/assets/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]

    DocumentRoot "d:/wwwroot/erp.fujinwanjia.com"
    <Directory "d:/wwwroot/erp.fujinwanjia.com">
        Options FollowSymLinks ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex index.html index.htm
    </Directory>
</VirtualHost>
