[common]
server_addr = 116.204.19.53
server_port = 7000
token = 123456

[jianyioa_mobile_h5]
type = tcp
local_ip = 127.0.0.1
local_port = 10086
remote_port = 7779

# 移动端：通过 3002 后端的 /m/ 路径提供（3002 server.js 已挂载移动端 SPA）
# 注意：frpc 的 type=tcp 不能做路径重写，所以 7780 端口直接把请求原封不动
# 转给本机 3002。访问 http://116.204.19.53:7780/ 会落到后端的 "/" 路由，
# 而 3002 SPA fallback 对 "/" 返回的是 PC 后台首页，不是 mobile。
#
# 解决方法（任选其一）：
#   A. 用户访问 http://116.204.19.53:7780/m/ （直接命中 /m/* 分支）
#   B. 把 local_port 改成 10086（直连 mobile dev，但失去 3002 的 API 代理能力）
#   C. frps 端用 vhost_http_port 做域名路由 + 域名解析
[jianyioa_mobile_h5_prod]
type = tcp
local_ip = 127.0.0.1
local_port = 3002
remote_port = 7780

[jianyioa_frontend_5555]
type = tcp
local_ip = 127.0.0.1
local_port = 5555
remote_port = 35189

[jianyioa_backend_3002]
type = tcp
local_ip = 127.0.0.1
local_port = 3002
remote_port = 7002

