<VirtualHost *:80>
    ServerName erp.fujinwanjia.com
    DocumentRoot D:\wwwroot\erp.fujinwanjia.com
    DirectoryIndex index.html

    <Directory D:\wwwroot\erp.fujinwanjia.com>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy access control - allow all proxy requests
    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/

    ErrorLog logs/erp.fujinwanjia.com-error.log
    CustomLog logs/erp.fujinwanjia.com-access.log combined
</VirtualHost>
