<VirtualHost *:80>
    ServerAdmin webmaster@example.com
	DocumentRoot "d:/wwwroot/erp.fujinwanjia.com"
	ServerAlias erp.fujinwanjia.com
    ErrorLog "D:/BtSoft/wwwlogs/erp.fujinwanjia.com-error.log"
    CustomLog "D:/BtSoft/wwwlogs/erp.fujinwanjia.com-access.log" combined
    #HTTP_TO_HTTPS_START
    <IfModule mod_rewrite.c>
        RewriteEngine on
        RewriteCond %{SERVER_PORT} !^443$
        RewriteRule (.*) https://%{SERVER_NAME}$1 [L,R=301]
    </IfModule>
    #HTTP_TO_HTTPS_END

    #redirect
    IncludeOptional conf/redirect/erp.fujinwanjia.com/*.conf

    #proxy
    IncludeOptional conf/proxy/erp.fujinwanjia.com/api-proxy-fix.conf

    # Ensure proxy is allowed
    <Proxy *>
        Require all granted
    </Proxy>

	ErrorDocument 404 /404.html
    IncludeOptional D:/BtSoft/apache/conf/vhost/extension/erp.fujinwanjia.com/*.conf

	#PATH - use <Location> instead of <Directory> to not conflict with ProxyPass
	<Location />
	    Options FollowSymLinks ExecCGI
	    AllowOverride All
	    Require all granted
	</Location>

	#DENY FILES
	<Files ~ "(\.user\.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README\.md)$">
	    Require all denied
	</Files>
</VirtualHost>

<VirtualHost *:443>
        ServerAdmin webmaster@example.com
        DocumentRoot "d:/wwwroot/erp.fujinwanjia.com"
        ServerAlias erp.fujinwanjia.com
        ErrorLog "D:/BtSoft/wwwlogs/erp.fujinwanjia.com-error.log"
        CustomLog "D:/BtSoft/wwwlogs/erp.fujinwanjia.com-access.log" combined

        #redirect
        IncludeOptional conf/redirect/erp.fujinwanjia.com/*.conf

        #proxy
        IncludeOptional conf/proxy/erp.fujinwanjia.com/*.conf

        # Ensure proxy is allowed
        <Proxy *>
            Require all granted
        </Proxy>

        ErrorDocument 404 /404.html
    IncludeOptional D:/BtSoft/apache/conf/vhost/extension/erp.fujinwanjia.com/*.conf

        #SSL
        SSLEngine On
        SSLCertificateFile conf/ssl/erp.fujinwanjia.com/fullchain.pem
        SSLCertificateKeyFile conf/ssl/erp.fujinwanjia.com/privkey.pem
        SSLCipherSuite EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH
        SSLProtocol All -SSLv2 -SSLv3
        SSLHonorCipherOrder On

        #PATH
        <Location />
            Options FollowSymLinks ExecCGI
            AllowOverride All
            Require all granted
        </Location>

        #DENY FILES
        <Files ~ "(\.user\.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README\.md)$">
            Require all denied
        </Files>

</VirtualHost>
